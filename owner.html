@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

const orderService = {
  async getOrders(storeId,filter){
    let orders = state.orders.filter(o=>o.store_id===storeId);
    if(filter && filter!=='all') orders = orders.filter(o=>o.status===filter);
    return orders.sort((a,b)=>b.created_at-a.created_at);
  },
  async getOrder(orderId){
    return state.orders.find(o=>o.id===orderId)||null;
  },
  async acceptOrder(orderId,prepMinutes){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order) return {success:false};
    const t = Date.now();
    order.status = ORDER_STATUS.ACCEPTED;
    order.accepted_at = t;
    order.preparation_minutes = prepMinutes;
    order.estimated_ready_at = t + prepMinutes*min;
    return {success:true,order};
  },
  async startPreparing(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order) return {success:false};
    order.status = ORDER_STATUS.PREPARING;
    order.preparing_started_at = Date.now();
    return {success:true,order};
  },
  async markReady(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order) return {success:false};
    order.status = ORDER_STATUS.READY;
    order.ready_at = Date.now();
    return {success:true,order};
  },
  async completeOrder(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order) return {success:false};
    order.status = ORDER_STATUS.COMPLETED;
    order.completed_at = Date.now();
    return {success:true,order};
  },
  async rejectOrder(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order) return {success:false};
    order.status = ORDER_STATUS.CANCELLED;
    order.cancelled_at = Date.now();
    return {success:true,order};
  },
  async updateStoreStatus(storeId,status){
    state.store.status = status;
    return {success:true};
  }
};

const menuService = {
  async getMenuItems(storeId,category){
    let items = state.menuItems;
    if(category && category!=='All') items = items.filter(i=>i.category===category);
    return items;
  },
  async addMenuItem(item){
    const newId = 'mi_'+(state.menuItems.length+1)+'_'+Date.now();
    state.menuItems.push({...item,id:newId});
    return {success:true,id:newId};
  },
  async updateMenuItem(id,updates){
    const idx = state.menuItems.findIndex(i=>i.id===id);
    if(idx===-1) return {success:false};
    Object.assign(state.menuItems[idx],updates);
    return {success:true};
  },
  async deleteMenuItem(id){
    state.menuItems = state.menuItems.filter(i=>i.id!==id);
    return {success:true};
  },
  async toggleAvailability(id){
    const item = state.menuItems.find(i=>i.id===id);
    if(!item) return {success:false};
    item.available = !item.available;
    return {success:true};
  }
};

const notificationService = {
  async getNotifications(){
    return state.notifications.sort((a,b)=>b.created_at-a.created_at);
  },
  async markRead(id){
    const n = state.notifications.find(n=>n.id===id);
    if(n) n.read = true;
  },
  async markAllRead(){
    state.notifications.forEach(n=>n.read=true);
  },
  getUnreadCount(){
    return state.notifications.filter(n=>!n.read).length;
  }
};

function formatCurrency(n){return '₹'+n.toLocaleString('en-IN')}
function timeAgo(ts){
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff<60) return diff+' sec ago';
  if(diff<3600) return Math.floor(diff/60)+' min ago';
  if(diff<86400) return Math.floor(diff/3600)+' hr ago';
  return Math.floor(diff/86400)+' days ago';
}
function formatTime(ts){
  const d=new Date(ts);
  return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
}
function getGreeting(){
  const h=new Date().getHours();
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  return 'Good evening';
}
function getRemainingTime(order){
  if(!order.estimated_ready_at) return null;
  const rem = order.estimated_ready_at - Date.now();
  if(rem<=0) return {minutes:0,seconds:0,total:0,expired:true};
  const minutes = Math.floor(rem/60000);
  const seconds = Math.floor((rem%60000)/1000);
  return {minutes,seconds,total:rem,expired:false};
}
function formatTimer(rem){
  if(!rem) return '--:--';
  const m = String(rem.minutes).padStart(2,'0');
  const s = String(rem.seconds).padStart(2,'0');
  return m+':'+s;
}
function getOrderStats(){
  const today = state.orders.filter(o=>{
    const d=new Date(o.created_at);const n=new Date();
    return d.toDateString()===n.toDateString() && o.status!==ORDER_STATUS.CANCELLED;
  });
  return {
    total:today.length,
    pending:today.filter(o=>o.status===ORDER_STATUS.PENDING).length,
    preparing:today.filter(o=>o.status===ORDER_STATUS.PREPARING).length,
    completed:today.filter(o=>o.status===ORDER_STATUS.COMPLETED).length
  };
}
function getTodayRevenue(){
  return state.orders.filter(o=>{
    const d=new Date(o.created_at);const n=new Date();
    return d.toDateString()===n.toDateString() && o.status===ORDER_STATUS.COMPLETED;
  }).reduce((s,o)=>s+o.total,0);
}
function icon(name,size=20){
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px"></i>`;
}

// TOAST SYSTEM
// ═══════════════════════════════════════════════
function showToast(message,type='info'){
  const root = document.getElementById('toast-root');
  const toast = document.createElement('div');
  toast.className = 'toast';
  const iconName = type==='success'?'check-circle':type==='error'?'x-circle':'info';
  toast.innerHTML = `${icon(iconName,20)}<span style="font-size:14px;font-weight:500">${message}</span>`;
  root.appendChild(toast);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{toast.classList.add('show')})});
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=>toast.remove(),400);
  },3000);
}

// ═══════════════════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════════════════
function showModal(content){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" id="modal-overlay"><div class="modal-sheet">${content}</div></div>`;
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{document.getElementById('modal-overlay').classList.add('show')})});
  lucide.createIcons({nameAttr:'data-lucide'});
  document.getElementById('modal-overlay').addEventListener('click',e=>{
    if(e.target.id==='modal-overlay') closeModal();
  });
}
function closeModal(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.classList.remove('show');
  setTimeout(()=>{document.getElementById('modal-root').innerHTML=''},300);
}

// NAVIGATION
// ═══════════════════════════════════════════════
function navigate(screen,opts={}){
  const app = document.getElementById('app');
  const prev = app.querySelector('.screen:not(.hidden)');
  state.prevScreen = state.screen;
  state.screen = screen;
  if(opts.orderId) state.selectedOrderId = opts.orderId;
  if(opts.menuItemId) state.selectedMenuItemId = opts.menuItemId;

  const html = renderScreen(screen);
  const wrapper = document.createElement('div');
  wrapper.className = 'screen hidden-right';
  wrapper.innerHTML = html;
  wrapper.id = 'screen-'+screen;
  app.appendChild(wrapper);

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      wrapper.classList.remove('hidden-right');
      if(prev){
        prev.classList.add('hidden-left');
        setTimeout(()=>prev.remove(),350);
      }
    });
  });

  lucide.createIcons({nameAttr:'data-lucide'});
  initScreenLogic(screen);
}

function switchTab(tab){
  if(state.activeTab===tab) return;
  const app = document.getElementById('app');
  const prev = app.querySelector('.screen');
  state.activeTab = tab;
  state.screen = tab;

  const html = renderScreen(tab);
  const wrapper = document.createElement('div');
  wrapper.className = 'screen hidden-right no-transition';
  wrapper.innerHTML = html;
  wrapper.id = 'screen-'+tab;
  app.appendChild(wrapper);

  requestAnimationFrame(()=>{
    wrapper.classList.remove('hidden-right');
    if(prev) prev.remove();
  });

  lucide.createIcons({nameAttr:'data-lucide'});
  initScreenLogic(tab);
}

function goBack(){
  const tabScreens = ['dashboard','orders','menu','analytics','profile'];
  if(tabScreens.includes(state.prevScreen)){
    switchTab(state.prevScreen);
  } else {
    switchTab(state.activeTab);
  }
}

function renderOrderTimeline(order){
  const steps = ['pending','accepted','preparing','ready','completed'];
  const labels = ['Pending','Accepted','Preparing','Ready','Done'];
  const icons = ['clock','check','chef-hat','package-check','circle-check-big'];
  const currentIdx = steps.indexOf(order.status);
  const isCancelled = order.status===ORDER_STATUS.CANCELLED;

  if(isCancelled){
    return `<div class="text-center py-4">
      <div class="inline-flex items-center gap-2 bg-error/10 text-error px-4 py-2 rounded-xl">
        ${icon('x-circle',18)}<span class="font-bold text-sm">Order Cancelled</span>
      </div>
    </div>`;
  }

  return `<div class="order-timeline">${steps.map((s,i)=>{
    const done = i < currentIdx;
    const current = i === currentIdx;
    const lineDone = i < currentIdx;
    return `<div class="timeline-step">
      ${i<steps.length-1?`<div class="timeline-line ${lineDone?'done':''}"></div>`:''}
      <div class="timeline-dot ${done?'done':''} ${current?'current':''}">
        ${done?icon(icons[i],14):(current?icon(icons[i],14):'')}
      </div>
      <div class="timeline-label ${done?'done':''} ${current?'current':''}">${labels[i]}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderPrepTimer(order){
  if(order.status!==ORDER_STATUS.PREPARING) return '';
  const rem = getRemainingTime(order);
  const expired = rem && rem.expired;
  const color = expired ? '#C94A3A' : (rem && rem.total < 120000 ? '#D89A32' : '#6366F1');
  return `<div class="bg-surface-2 rounded-2xl p-4 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div style="width:40px;height:40px;border-radius:12px;background:${color}15;display:flex;align-items:center;justify-content:center">
        ${icon('timer',20)}
      </div>
      <div>
        <div class="text-xs text-txt-2 font-medium">Preparation Time</div>
        <div class="font-bold text-xl" style="color:${color}" id="timer-detail-${order.id}">${formatTimer(rem)}</div>
      </div>
    </div>
    <div class="text-xs text-txt-2">Est. ${order.preparation_minutes} min</div>
  </div>`;
}

  return `<div class="screen" style="display:flex;flex-direction:column;height:100%;background:#F8EBDD">

function renderOrderDetail(){
  const order = state.orders.find(o=>o.id===state.selectedOrderId);
  if(!order) return renderEmptyState('alert-circle','Order not found','This order may have been removed');

  const itemCount = order.items.reduce((s,i)=>s+i.qty,0);
  const isPending = order.status===ORDER_STATUS.PENDING;
  const isAccepted = order.status===ORDER_STATUS.ACCEPTED;
  const isPreparing = order.status===ORDER_STATUS.PREPARING;
  const isReady = order.status===ORDER_STATUS.READY;
  const isCompleted = order.status===ORDER_STATUS.COMPLETED;
  const isCancelled = order.status===ORDER_STATUS.CANCELLED;

  let actionButtons = '';
  if(isPending){
    actionButtons = `<div class="flex gap-3 mt-4">
      <button class="btn-primary flex-1" onclick="showPrepTimeModal('${order.id}')">Accept Order</button>
      <button class="btn-outline" style="width:auto;padding:14px 20px" onclick="showRejectConfirm('${order.id}')">${icon('x',20)}</button>
    </div>`;
  } else if(isAccepted){
    actionButtons = `<button class="btn-primary mt-4" onclick="handleStartPreparing('${order.id}')">Start Preparing</button>`;
  } else if(isPreparing){
    actionButtons = `<button class="btn-primary mt-4" style="background:#4F8A4C" onclick="handleMarkReady('${order.id}')">Mark as Ready</button>`;
  } else if(isReady){
    actionButtons = `<button class="btn-primary mt-4" style="background:#3B2118" onclick="handleCompleteOrder('${order.id}')">Complete Order</button>`;
  }

  return `<div class="screen" style="display:flex;flex-direction:column;height:100%;background:#F8EBDD">
    <div style="flex:1;overflow-y:auto">
      <!-- Header -->
      <div class="flex items-center gap-3 px-5 pt-6 pb-2">
        <button onclick="goBack()" class="p-2 rounded-xl bg-surface border border-bdr cursor-pointer" style="border:none">${icon('arrow-left',20)}</button>
        <h1 class="text-lg font-bold text-txt flex-1">Order #${order.id}</h1>
        ${renderStatusBadge(order.status)}
      </div>

      <!-- Timeline -->
      <div class="px-5 mt-2">${renderOrderTimeline(order)}</div>

      <!-- Timer -->
      <div class="px-5 mt-2">${renderPrepTimer(order)}</div>

      <!-- Customer Info -->
      <div class="px-5 mt-2">
        <div class="bg-surface rounded-2xl p-4 border border-bdr" style="box-shadow:0 1px 4px rgba(59,33,24,.05)">
          <div class="text-xs font-semibold text-txt-2 uppercase tracking-wide mb-3">Customer</div>
          <div class="flex items-center gap-3 mb-2">
            <div style="width:40px;height:40px;border-radius:12px;background:#D65A2A15;display:flex;align-items:center;justify-content:center;color:#D65A2A">${icon('user',20)}</div>
            <div>
              <div class="font-semibold text-sm">${order.customer_name}</div>
              <div class="text-xs text-txt-2">${order.customer_phone}</div>
            </div>
          </div>
          <div class="flex gap-4 mt-3">
            <div class="flex items-center gap-2 text-xs text-txt-2">${icon('clock',14)}${formatTime(order.created_at)}</div>
            <div class="flex items-center gap-2 text-xs text-txt-2">${icon(order.order_type==='pickup'?'map-pin':'truck',14)}${order.order_type==='pickup'?'Pickup':'Delivery'}</div>
          </div>
        </div>
      </div>

      <!-- Items -->
      <div class="px-5 mt-4">
        <div class="text-xs font-semibold text-txt-2 uppercase tracking-wide mb-3">Items (${itemCount})</div>
        ${order.items.map(item=>`
          <div class="bg-surface rounded-2xl p-3 mb-2 border border-bdr flex items-center gap-3">
            <img src="${item.image}" class="w-14 h-14 rounded-xl object-cover" style="min-width:56px" onerror="this.style.background='#F3DFCE'">
            <div class="flex-1">
              <div class="font-semibold text-sm">${item.name} <span class="text-txt-2 font-normal">x${item.qty}</span></div>
              ${item.customization?`<div class="text-xs text-primary mt-1">${item.customization}</div>`:''}
            </div>
            <div class="font-bold text-sm text-txt">${formatCurrency(item.price*item.qty)}</div>
          </div>
        `).join('')}
      </div>

      <!-- Totals -->
      <div class="px-5 mt-4">
        <div class="bg-surface rounded-2xl p-4 border border-bdr">
          <div class="flex justify-between text-sm mb-2"><span class="text-txt-2">Subtotal</span><span>${formatCurrency(order.subtotal)}</span></div>
          <div class="flex justify-between text-sm mb-2"><span class="text-txt-2">Tax (5%)</span><span>${formatCurrency(order.tax)}</span></div>
          <div class="flex justify-between text-sm mb-2"><span class="text-txt-2">Packaging</span><span>${formatCurrency(order.packaging)}</span></div>
          ${order.discount>0?`<div class="flex justify-between text-sm mb-2"><span class="text-txt-2">Discount</span><span class="text-success">-${formatCurrency(order.discount)}</span></div>`:''}
          <div style="border-top:1.5px solid #E8D2C0;margin-top:8px;padding-top:10px" class="flex justify-between">
            <span class="font-bold text-base">Total</span>
            <span class="font-black text-lg text-primary">${formatCurrency(order.total)}</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="px-5 mt-2 pb-8">${actionButtons}</div>
    </div>
  </div>`;
}

          ${[{id:'today',label:'Today'},{id:'7days',label:'7 Days'},{id:'30days',label:'30 Days'}].map(p=>`<div class="chip ${state.analyticsPeriod===p.id?'active':''}" onclick="setAnalyticsPeriod('${p.id}')">${p.label}</div>`).join('')}

      <!-- Stat Cards -->

        </div>
        <div class="bg-surface rounded-2xl p-4 border border-bdr mt-3 flex items-center justify-between" style="box-shadow:0 1px 4px rgba(59,33,24,.05)">
          <div class="flex items-center gap-2">
            <div style="width:28px;height:28px;border-radius:8px;background:#C94A3A12;display:flex;align-items:center;justify-content:center;color:#C94A3A">${icon('x-circle',15)}</div>

  return `<div class="screen" style="display:flex;flex-direction:column;height:100%;background:#F8EBDD">

      <div class="flex items-center gap-3 px-5 pt-6 pb-2">

// ═══════════════════════════════════════════════
// CHART RENDERING
// ═══════════════════════════════════════════════
function drawRevenueChart(){
  const canvas = document.getElementById('revenue-chart');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  ctx.scale(dpr,dpr);
  const w = rect.width;
  const h = rect.height;
  const data = mockWeeklyRevenue;
  const maxVal = Math.max(...data.map(d=>d.amount))*1.15;
  const barWidth = Math.max(1,(w-60)/data.length*0.5);
  const gap = (w-40)/data.length;
  const chartH = h-30;

  // Grid lines
  ctx.strokeStyle='#E8D2C040';
  ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const y = 10 + (chartH-10)/3*i;
    ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-10,y);ctx.stroke();
  }

  // Bars
  data.forEach((d,i)=>{
    const x = 35 + gap*i + gap/2 - barWidth/2;
    const barH = Math.max(2,(d.amount/maxVal)*(chartH-20));
    const y = chartH - barH;

    // Bar gradient
    const grad = ctx.createLinearGradient(x,y,x,chartH);
    grad.addColorStop(0,'#D65A2A');
    grad.addColorStop(1,'#B9441C');
    ctx.fillStyle = grad;

    // Rounded top
    const r = Math.min(barWidth/2,6);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+barWidth-r,y);
    ctx.quadraticCurveTo(x+barWidth,y,x+barWidth,y+r);
    ctx.lineTo(x+barWidth,chartH);
    ctx.lineTo(x,chartH);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.fill();

    // Label
    ctx.fillStyle='#806A5D';
    ctx.font='600 10px DM Sans';
    ctx.textAlign='center';
    ctx.fillText(d.day,x+barWidth/2,h-4);

    // Value
    ctx.fillStyle='#3B2118';
    ctx.font='700 9px DM Sans';
    ctx.fillText('₹'+(d.amount/1000).toFixed(1)+'k',x+barWidth/2,y-6);
  });
}

// ═══════════════════════════════════════════════
// TIMER SYSTEM
// ═══════════════════════════════════════════════
function startTimerSystem(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(()=>{
    let needsUpdate = false;
    state.orders.forEach(o=>{
      if(o.status===ORDER_STATUS.PREPARING){
        const el1 = document.getElementById('timer-detail-'+o.id);
        const el2 = document.getElementById('timer-card-'+o.id);
        const rem = getRemainingTime(o);
        if(el1){
          el1.textContent = formatTimer(rem);
          if(rem && rem.expired) el1.style.color='#C94A3A';
          else if(rem && rem.total < 120000) el1.style.color='#D89A32';
          else el1.style.color='#6366F1';
        }
        if(el2) el2.textContent = formatTimer(rem);
        needsUpdate = true;
      }
    });
  },1000);
}
